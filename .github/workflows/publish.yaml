name: Publish

on:
  push:
    tags:
      - v*

jobs:
  tests:
    uses: ./.github/workflows/_tests.yaml

  publish:
    needs: tests
    name: Build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7

      - name: Verify tag matches pyproject.toml version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          TOML_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$VERSION" != "$TOML_VERSION" ]; then
            echo "ERROR: tag $TAG does not match pyproject.toml version $TOML_VERSION"
            exit 1
          fi

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: context.ref.replace('refs/tags/', ''),
              generate_release_notes: true
            });
