[project]
name = "resource-semaphore"
version = "1.4.0"
description = "A typed, multi-resource semaphore for managing and applying backpressure to single-process application resources."
readme = "README.md"
authors = [{ name = "Abdulrahman Hedya", email = "abdohedya19@gmail.com" }]
requires-python = "<3.16,>=3.11"
license = { file = "LICENSE" }
dependencies = []
keywords = [
    "semaphore",
    "resources",
    "backpressure",
    "async",
    "synchronization",
    "concurrency",
    "free-threaded",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries",
    "Framework :: AsyncIO",
]

[project.urls]
Homepage = "https://github.com/ahedya/resource-semaphore"
Repository = "https://github.com/ahedya/resource-semaphore"
Issues = "https://github.com/ahedya/resource-semaphore/issues"
Documentation = "https://github.com/ahedya/resource-semaphore/tree/main/docs"

[project.optional-dependencies]
utils = ["psutil>=7.2.2"]

[dependency-groups]
dev = [
    "nox>=2026.10.20",
    "pre-commit>=4.6.1",
    "pyrefly==1.3.0-dev1",
    "pytest-benchmark[histogram]>=5.2.3",
    "pytest-benchmark>=5.2.3",
    "ruff>=0.16.0",
    "types-psutil>=7.2.2.20260518",
]

test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.11.0,~=0.12.0"]
build-backend = "uv_build"

[tool.pyrefly]
preset = "default"
search-path = ["src", "."]
python-version = "3.11"

[tool.pytest]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
env = ["ENVIRONMENT=TEST"]
addopts = ["--ignore=tests/benchmark"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "UP",   # pyupgrade
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "F401", # unused imports
]
ignore = [
    "E501",  # line too long
    "B904",  # raise without from e
    "UP037", # quoted types
    "E712",  # explicit equality comparisons
]
